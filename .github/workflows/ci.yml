name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scripts parse
        run: for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done
      - name: Unit tests pass
        run: node --test scripts/lib/*.test.mjs
      - name: Issue forms match the templates
        run: node scripts/repo-setup.mjs forms .github .github --check
      - name: Agent files match the templates
        run: node scripts/repo-setup.mjs agents .github . --check
      - name: Agent templates and files use Prettier style
        run: npx --yes prettier@3 --check --print-width 120 templates/agents/* AGENTS.md CLAUDE.md GEMINI.md .github/copilot-instructions.md
      - name: Agent templates and files pass markdownlint
        run: npx --yes markdownlint-cli2@0.24.0
      - name: Workflows and forms are valid YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY2'
          import glob, sys, yaml
          bad = 0
          files = sorted(set(glob.glob(".github/**/*.yml", recursive=True) + glob.glob("templates/agents/**/*.yml", recursive=True)))
          for f in files:
              try: yaml.safe_load(open(f, encoding="utf-8"))
              except yaml.YAMLError as e: print(f"::error file={f}::{e}"); bad += 1
          sys.exit(bad)
          PY2
      - name: Assets match their generator
        run: |
          node scripts/generate-assets.mjs
          git diff --exit-code -- profile/assets || { echo "::error::profile/assets differ from scripts/generate-assets.mjs; run it and commit"; exit 1; }
      - name: SVGs are valid XML
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          bad = 0
          for f in glob.glob("profile/assets/*.svg"):
              try: ET.parse(f)
              except ET.ParseError as e: print(f"::error file={f}::{e}"); bad += 1
          sys.exit(bad)
          PY
      - name: README images exist
        run: |
          grep -o 'src="\./assets/[^"]*"' profile/README.md | sed 's/src="\.\///;s/"$//' | while read -r f; do
            test -f "profile/$f" || { echo "::error::missing profile/$f"; exit 1; }
          done
