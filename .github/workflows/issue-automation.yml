name: Issue automation

# Wspólny automat zgłoszeń organizacji (ADR-0086), wzorowany na repozytorium Aven. Działa w tym
# repozytorium, a pozostałe wywołują go jedną linijką (workflow_call), np.:
#
#   on:
#     issues:
#       types: [opened, edited, reopened, closed]
#   permissions:
#     issues: write
#     contents: read
#   jobs:
#     issue:
#       uses: Monorise-Team/.github/.github/workflows/issue-automation.yml@main
#       secrets: inherit
#
# 1. Triage (opened, edited): formularze nie umieją nadać etykiet z odpowiedzi, więc robi to automat:
#    „Obszar” -> area: <wartość> (gdy taka etykieta istnieje w repozytorium), „Priorytet” -> prio: <wartość>,
#    „Rodzaj” poprawia type: (Wydajność -> perf, Testy -> test). Z obszarem i priorytetem znika
#    `meta: ❓ needs triage`. Na końcu tytuł dostaje typ i numer: „Problem” -> „🐛 Bugfix: [009] Problem”.
#    Etykiety pól to polskie nazwy z formularzy (templates/ISSUE_TEMPLATE); zmiana nazwy pola wymaga zmiany tutaj.
# 2. Tablica „Monorise” (opened, reopened -> 📥 Backlog, closed -> ✅ Done). Wymaga sekretu PROJECT_TOKEN
#    (token classic z uprawnieniami project i repo); bez niego krok się pomija, a kartę dodaje formularz.
# 3. Panel boczny (każde zdarzenie): autor jako osoba przypisana, typ zgłoszenia organizacji (Bug, Feature,
#    Task), milestone najbliższego wydania (najniższe otwarte vX.Y.Z), pola zgłoszeń organizacji
#    (Priority z „Priorytet”/etykiety prio:, Effort z „Nakład pracy”, Start date = dzień założenia w strefie
#    Europe/Warsaw, Target date = Start date + 0/2/7 dni albo dzień zamknięcia przy zdarzeniu closed) oraz
#    powiązania z pola „Zależności” także między repozytoriami (`#N`, `Repo#N`, `Monorise-Team/Repo#N`, URL;
#    wiele po przecinku; na `closed` uzupełniamy tylko puste Target date). Reguły żyją w scripts/lib/issue-meta.mjs.
#    Wszystko „najlepiej, jak się da”: błąd tutaj daje ostrzeżenie i nie zatrzymuje reszty.
# Zgłoszenia od botów (np. panel zależności Renovate) automat pomija w całości.

on:
  issues:
    types: [opened, edited, reopened, closed]
  workflow_call:
    inputs:
      project-owner:
        description: Właściciel tablicy (organizacja)
        type: string
        default: Monorise-Team
      project-number:
        description: Numer tablicy
        type: number
        default: 3
    secrets:
      PROJECT_TOKEN:
        required: false

permissions:
  issues: write
  contents: read

jobs:
  issue:
    name: Triage, board and sidebar
    # Zgłoszeń od botów nie ruszamy: Renovate rozpoznaje swój panel zależności po tytule, a po zmianie
    # tytułu zakładałby nowy panel przy każdym przebiegu.
    if: >-
      github.event.issue.user.type != 'Bot' &&
      (github.event.action != 'edited' || github.event.changes.title || github.event.changes.body)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Triage and title
        if: github.event.action == 'opened' || github.event.action == 'edited'
        uses: actions/github-script@v7
        with:
          script: |
            const TRIAGE = 'meta: ❓ needs triage';
            const PRIOS = ['P0-critical', 'P1-high', 'P2-medium', 'P3-low'];
            const ref = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number };
            const body = context.payload.issue.body || '';

            // Formularze zapisują się jako „### Pole\n\nwartość”
            const sections = {};
            for (const chunk of body.split(/^### /m).slice(1)) {
              const nl = chunk.indexOf('\n');
              if (nl !== -1) sections[chunk.slice(0, nl).trim()] = chunk.slice(nl + 1).trim();
            }
            const values = (name) =>
              (sections[name] || '').split(/[,\n]/).map((v) => v.trim()).filter((v) => v && v !== '_No response_');

            const repoLabels = new Set(
              (await github.paginate(github.rest.issues.listLabelsForRepo, { owner: ref.owner, repo: ref.repo, per_page: 100 }))
                .map((label) => label.name),
            );
            const add = new Set();
            const remove = new Set();

            for (const area of values('Obszar')) {
              if (repoLabels.has(`area: ${area}`)) add.add(`area: ${area}`);
            }
            const prio = values('Priorytet')[0];
            if (PRIOS.includes(prio)) {
              add.add(`prio: ${prio}`);
              for (const p of PRIOS) if (p !== prio) remove.add(`prio: ${p}`);
            }
            const kind = values('Rodzaj')[0] || '';
            if (/^Wydajno/.test(kind)) {
              add.add('type: ⚡ perf');
              remove.add('type: ♻️ refactor');
            } else if (/^Testy/.test(kind)) {
              add.add('type: 🧪 test');
              remove.add('type: 🔧 chore');
            }

            const current = context.payload.issue.labels.map((l) => l.name);
            const hasArea = [...add, ...current].some((l) => l.startsWith('area: '));
            const hasPrio = [...add].some((l) => l.startsWith('prio: ')) || current.some((l) => l.startsWith('prio: '));
            // Formularz dokumentacji (albo repozytorium bez obszarów) nie pyta o obszar
            const asksForArea = 'Obszar' in sections;
            if (hasPrio && (hasArea || !asksForArea)) remove.add(TRIAGE);

            const toAdd = [...add].filter((l) => !current.includes(l) && repoLabels.has(l));
            const toRemove = [...remove].filter((l) => current.includes(l));
            if (toAdd.length) await github.rest.issues.addLabels({ ...ref, labels: toAdd });
            for (const name of toRemove) await github.rest.issues.removeLabel({ ...ref, name });
            core.info(`Etykiety: +${toAdd.join(', ') || '-'} / -${toRemove.join(', ') || '-'}`);

            // Tytuł na końcu: typ mógł się właśnie zmienić (Wydajność -> perf, Testy -> test)
            const PREFIX = {
              'type: ✨ feature': '✨ Feature', 'type: 🐛 bugfix': '🐛 Bugfix', 'type: ♻️ refactor': '♻️ Refactor',
              'type: ⚡ perf': '⚡ Perf', 'type: 🔧 chore': '🔧 Chore', 'type: 📚 docs': '📚 Docs',
              'type: 🧪 test': '🧪 Test', 'type: 🔒 security': '🔒 Security', 'type: 🔍 spike': '🔍 Spike',
            };
            const title = context.payload.issue.title || '';
            if (/\[\d{3,}\]/.test(title)) return core.info('Tytuł ma już numer.');
            const final = new Set([...current, ...toAdd]);
            for (const l of toRemove) final.delete(l);
            const prefix = PREFIX[[...final].find((l) => l.startsWith('type: '))];
            const padded = String(ref.issue_number).padStart(3, '0');
            const newTitle = prefix ? `${prefix}: [${padded}] ${title}` : `[${padded}] ${title}`;
            await github.rest.issues.update({ ...ref, title: newTitle.trim() });
            core.info(`Tytuł -> ${newTitle}`);

      - name: Board
        if: github.event.action != 'edited'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          OWNER: ${{ inputs.project-owner || 'Monorise-Team' }}
          NUMBER: ${{ inputs.project-number || 3 }}
          CONTENT_ID: ${{ github.event.issue.node_id }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Brak sekretu PROJECT_TOKEN: tablicę zostawiam formularzowi i automatom samej tablicy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$ACTION" = "closed" ]; then COLUMN="✅ Done"; else COLUMN="📥 Backlog"; fi
          # Kolumny szukamy po nazwie, więc identyfikatory tablicy nie są nigdzie wpisane na sztywno
          JSON=$(gh api graphql -f owner="$OWNER" -F number="$NUMBER" -f query='
            query($owner: String!, $number: Int!) {
              organization(login: $owner) { projectV2(number: $number) {
                id
                field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } }
              } }
            }')
          PROJECT_ID=$(echo "$JSON" | jq -r '.data.organization.projectV2.id')
          FIELD_ID=$(echo "$JSON" | jq -r '.data.organization.projectV2.field.id')
          OPTION_ID=$(echo "$JSON" | jq -r --arg column "$COLUMN" '.data.organization.projectV2.field.options[] | select(.name == $column) | .id')
          if [ -z "$OPTION_ID" ]; then
            echo "::warning::Tablica nie ma kolumny $COLUMN"
            exit 0
          fi
          ITEM_ID=$(gh api graphql -f project="$PROJECT_ID" -f content="$CONTENT_ID" -f query='
            mutation($project: ID!, $content: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $content}) { item { id } }
            }' --jq '.data.addProjectV2ItemById.item.id')
          gh api graphql -f project="$PROJECT_ID" -f item="$ITEM_ID" -f field="$FIELD_ID" -f option="$OPTION_ID" -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
              updateProjectV2ItemFieldValue(input: {projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}}) {
                projectV2Item { id }
              }
            }' > /dev/null
          echo "Zgłoszenie #${{ github.event.issue.number }} -> $COLUMN" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout shared metadata rules
        uses: actions/checkout@v5
        with:
          repository: Monorise-Team/.github
          ref: main
          path: .monorise-shared
          sparse-checkout: scripts/lib
          persist-credentials: false

      - name: Sidebar
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const meta = await import(pathToFileURL(path.resolve('.monorise-shared/scripts/lib/issue-meta.mjs')).href);

            const issue = context.payload.issue;
            const action = context.payload.action;
            const ref = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };
            const summary = [];
            const attempt = async (what, fn) => {
              try {
                await fn();
                return true;
              } catch (error) {
                core.warning(`${what}: ${error.message}`);
                summary.push(`- ⚠️ ${what}: pominięto (${error.message})`);
                return false;
              }
            };

            if (!issue.assignees?.length && issue.user?.type === 'User') {
              if (await attempt('osoba przypisana', () => github.rest.issues.addAssignees({ ...ref, assignees: [issue.user.login] }))) {
                summary.push(`- Osoba przypisana: \`${issue.user.login}\``);
              }
            }

            // Odśwież etykiety po kroku Triage (na opened/edited mogły się właśnie zmienić)
            let labels = (issue.labels || []).map((l) => l.name);
            try {
              const fresh = (await github.rest.issues.get(ref)).data;
              labels = (fresh.labels || []).map((l) => l.name);
            } catch {
              // Zostajemy przy etykietach ze zdarzenia
            }

            // Typ zgłoszenia organizacji (Bug, Feature, Task), gdy organizacja ma typy
            const type = meta.resolveIssueType(labels);
            if (!issue.type) {
              if (await attempt('typ zgłoszenia', () => github.request('PATCH /repos/{owner}/{repo}/issues/{issue_number}', { ...ref, type }))) {
                summary.push(`- Typ zgłoszenia: \`${type}\``);
              }
            }

            // Milestone najbliższego wydania; zamknięte jako „not planned” z niego wypada
            if (action === 'closed' && issue.state_reason === 'not_planned' && issue.milestone) {
              if (await attempt('milestone', () => github.rest.issues.update({ ...ref, milestone: null }))) {
                summary.push('- Milestone: usunięto (zamknięte jako not planned)');
              }
            } else if (!issue.milestone && action !== 'closed') {
              const open = await github.paginate(github.rest.issues.listMilestones, { owner: ref.owner, repo: ref.repo, state: 'open', per_page: 100 });
              const nearest = meta.findNearestOpenMilestone(open);
              if (nearest) {
                if (await attempt('milestone', () => github.rest.issues.update({ ...ref, milestone: nearest.number }))) {
                  summary.push(`- Milestone: \`${nearest.title}\``);
                }
              }
            }

            // Pola zgłoszeń organizacji (Priority, Effort, Start date, Target date)
            await attempt('pola zgłoszenia', async () => {
              const orgData = await github.graphql(meta.ORG_ISSUE_FIELDS_QUERY, { org: ref.owner });
              const orgFields = meta.indexOrgIssueFields(orgData?.organization);
              const issueData = await github.graphql(meta.ISSUE_FIELD_VALUES_QUERY, {
                owner: ref.owner,
                repo: ref.repo,
                number: ref.issue_number,
              });
              const issueNode = issueData?.repository?.issue;
              const currentFields = meta.extractCurrentFieldValues(issueNode?.issueFieldValues?.nodes || []);

              const { updates } = meta.planIssueFieldUpdates({
                body: issue.body || '',
                labels,
                state: action === 'closed' ? 'CLOSED' : 'OPEN',
                createdAt: issue.created_at,
                closedAt: issue.closed_at,
                currentFields,
                overwriteFromSource: action === 'edited',
                onlyTargetOnClose: action === 'closed',
              });
              const { inputs, applied, skipped } = meta.buildSetIssueFieldsInput(updates, orgFields);
              for (const item of skipped) {
                core.warning(`pole zgłoszenia: pominięto ${item}`);
                summary.push(`- Pominięto pole: ${item}`);
              }
              if (inputs.length) {
                await github.graphql(meta.SET_ISSUE_FIELD_VALUE_MUTATION, {
                  issueId: issueNode?.id || issue.node_id,
                  issueFields: inputs,
                });
                summary.push(`- Pola zgłoszenia: ${applied.map((a) => `\`${a}\``).join(', ')}`);
              } else {
                summary.push('- Pola zgłoszenia: bez zmian (już uzupełnione lub brak źródła)');
              }
            });

            // Powiązania z pola „Zależności” (także między repozytoriami) — tylko na opened, edited, reopened
            if (action !== 'closed') {
              const relations = meta.parseRelations(issue.body || '', {
                defaultOwner: ref.owner,
                defaultRepo: ref.repo,
                selfNumber: issue.number,
              });
              if (relations.blockedBy.length || relations.parents.length) {
                let existingBlocked = new Set();
                let existingParentKey = null;
                try {
                  const relData = await github.graphql(meta.ISSUE_RELATIONS_QUERY, {
                    owner: ref.owner,
                    repo: ref.repo,
                    number: ref.issue_number,
                  });
                  const relIssue = relData?.repository?.issue;
                  existingBlocked = new Set(
                    (relIssue?.blockedBy?.nodes || [])
                      .filter((n) => n?.number && n?.repository?.name && n?.repository?.owner?.login)
                      .map((n) => meta.issueRefKey({ owner: n.repository.owner.login, repo: n.repository.name, number: n.number })),
                  );
                  if (relIssue?.parent?.number && relIssue?.parent?.repository?.name && relIssue?.parent?.repository?.owner?.login) {
                    existingParentKey = meta.issueRefKey({
                      owner: relIssue.parent.repository.owner.login,
                      repo: relIssue.parent.repository.name,
                      number: relIssue.parent.number,
                    });
                  }
                } catch (error) {
                  core.warning(`odczyt istniejących relacji: ${error.message}`);
                }

                const resolveNodeId = async (targetRef) => {
                  const res = await github.graphql(meta.ISSUE_NODE_ID_QUERY, {
                    owner: targetRef.owner,
                    repo: targetRef.repo,
                    number: targetRef.number,
                  });
                  return res?.repository?.issue?.id || null;
                };

                for (const targetRef of relations.blockedBy) {
                  const label = meta.formatIssueRef(targetRef, { defaultOwner: ref.owner, defaultRepo: ref.repo });
                  if (existingBlocked.has(meta.issueRefKey(targetRef))) {
                    summary.push(`- Pominięto relację blokowane przez \`${label}\` (już istnieje)`);
                    continue;
                  }
                  const ok = await attempt(`blokowane przez ${label}`, async () => {
                    const blockingIssueId = await resolveNodeId(targetRef);
                    if (!blockingIssueId) throw new Error('nie znaleziono zgłoszenia albo brak dostępu');
                    try {
                      await github.graphql(meta.ADD_BLOCKED_BY_MUTATION, {
                        issueId: issue.node_id,
                        blockingIssueId,
                      });
                    } catch (error) {
                      if (/already|duplicate|exists/i.test(error.message || '')) return;
                      throw error;
                    }
                  });
                  if (ok) summary.push(`- Relacja: blokowane przez \`${label}\``);
                }

                for (const targetRef of relations.parents) {
                  const label = meta.formatIssueRef(targetRef, { defaultOwner: ref.owner, defaultRepo: ref.repo });
                  if (existingParentKey === meta.issueRefKey(targetRef)) {
                    summary.push(`- Pominięto relację etap \`${label}\` (już istnieje)`);
                    continue;
                  }
                  const ok = await attempt(`etap ${label}`, async () => {
                    const parentId = await resolveNodeId(targetRef);
                    if (!parentId) throw new Error('nie znaleziono zgłoszenia albo brak dostępu');
                    try {
                      await github.graphql(meta.ADD_SUB_ISSUE_MUTATION, {
                        parentId,
                        subIssueId: issue.node_id,
                      });
                    } catch (error) {
                      if (/already|duplicate|exists/i.test(error.message || '')) return;
                      throw error;
                    }
                  });
                  if (ok) summary.push(`- Relacja: etap \`${label}\``);
                }
              }
            }

            if (summary.length) {
              await core.summary
                .addHeading(`Panel boczny zgłoszenia #${issue.number}`, 3)
                .addRaw(`${summary.join('\n')}\n`)
                .write();
            }
